<header>
    <nav
        class="bg-gray-100 border-gray-200 px-4 lg:px-6 py-2.5 dark:bg-gray-800">
        <div
            class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl">
            <a href="https://flowbite.com" class="flex items-center">
                <img src="/images/logo.png"
                    class="mr-3 h-6 sm:h-9" alt="Flowbite Logo" />
                <span
                    class="self-center text-xl font-semibold whitespace-nowrap dark:text-white">Public
                    Pulse</span>
            </a>

            <div *ngIf="!valid" class="flex items-center lg:order-2">
                <a routerLink="/login"
                    class="text-gray-800 dark:text-white hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 lg:px-5 py-2 lg:py-2.5 mr-2 dark:hover:bg-gray-700 focus:outline-none dark:focus:ring-gray-800">
                    Login</a>
                <a routerLink="/register"
                    class="text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-4 lg:px-5 py-2 lg:py-2.5 mr-2 dark:bg-primary-600 dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800 bg-blue-600">Get
                    started</a>
                <button data-collapse-toggle="mobile-menu-2" type="button"
                    class="inline-flex items-center p-2 ml-1 text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
                    aria-controls="mobile-menu-2" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg"><path
                            fill-rule="evenodd"
                            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                            clip-rule="evenodd"></path></svg>
                    <svg class="hidden w-6 h-6" fill="currentColor"
                        viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg"><path
                            fill-rule="evenodd"
                            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                            clip-rule="evenodd"></path></svg>
                </button>
            </div>

            <div *ngIf="valid && user"
                class="flex items-center lg:order-2 space-x-3 bg-white dark:bg-gray-800 px-4 py-2 rounded">
                <h3
                    class="text-gray-800 dark:text-gray-200 text-lg font-semibold">
                    Welcome, <span
                        class="text-blue-600 dark:text-blue-400">{{user.name}}</span>
                </h3>
            </div>

            <div
                class="hidden justify-between items-center w-full lg:flex lg:w-auto lg:order-1"
                id="mobile-menu-2">
                <ul
                    class="flex flex-col mt-4 font-medium lg:flex-row lg:space-x-8 lg:mt-0">
                    <li>
                        <a href="#"
                            class="block py-2 pr-4 pl-3 rounded bg-primary-700 lg:bg-transparent lg:text-primary-700 lg:p-0 text-black dark:text-white"
                            aria-current="page">Home</a>
                    </li>
                    <li>
                        <a href="#"
                            class="block py-2 pr-4 pl-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700 lg:p-0 dark:text-gray-400 lg:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white lg:dark:hover:bg-transparent dark:border-gray-700">Politicians</a>
                    </li>
                    <li>
                        <a href="#"
                            class="block py-2 pr-4 pl-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700 lg:p-0 dark:text-gray-400 lg:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white lg:dark:hover:bg-transparent dark:border-gray-700">Features</a>
                    </li>
                    <li>
                        <a href="#"
                            class="block py-2 pr-4 pl-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700 lg:p-0 dark:text-gray-400 lg:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white lg:dark:hover:bg-transparent dark:border-gray-700">Team</a>
                    </li>
                    <li>
                        <a href="#"
                            class="block py-2 pr-4 pl-3 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-700 lg:p-0 dark:text-gray-400 lg:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white lg:dark:hover:bg-transparent dark:border-gray-700">About
                            Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div class="h-screen dark:bg-gray-600 flex items-center justify-center overflow-hidden">
  <div class="flex dark:bg-gray-200 rounded-2xl shadow-2xl overflow-hidden mx-auto max-w-sm lg:max-w-5xl w-full">

    <!-- LEFT IMAGE SECTION -->
    <div class="hidden lg:block lg:w-1/2 bg-cover bg-center"
      style="background-image:url('https://images.unsplash.com/photo-1581090700227-4c4f50d29a68?auto=format&fit=crop&w=800&q=80')">
      
      <div class="h-full w-full bg-black bg-opacity-40 flex items-center justify-center">
        <div class="text-center px-6">
          <h2 class="text-3xl font-bold text-white mb-4">
            Raise Your Voice
          </h2>
          <p class="text-gray-200 text-lg">
            Report infrastructure, sanitation, and public service issues instantly.
          </p>
        </div>
      </div>

    </div>

    <!-- RIGHT FORM SECTION -->
    <div class="w-full p-8 lg:w-1/2">

      <h2 class="text-3xl font-bold text-gray-800 text-center">
        Report a Problem
      </h2>
      <p class="text-gray-500 text-center mt-2">
        Your issue will directly reach the concerned authorities.
      </p>

      <form (ngSubmit)="submitProblem()" #problemForm="ngForm" class="mt-6">

        <!-- Description -->
        <div class="mt-4">
          <label class="block text-gray-700 text-sm font-semibold mb-2">
            Description
          </label>
          <textarea
            name="description"
            [(ngModel)]="problem.description"
            required
            rows="4"
            class="bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-300 rounded-lg py-3 px-4 block w-full transition">
          </textarea>
        </div>

        <!-- Address -->
        <div class="mt-4">
          <label class="block text-gray-700 text-sm font-semibold mb-2">
            Address
          </label>
          <input
            type="text"
            name="address"
            [(ngModel)]="problem.address"
            required
            class="bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-300 rounded-lg py-3 px-4 block w-full transition">
        </div>

        <!-- City & Pincode Row -->
        <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">

          <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">
              City
            </label>
            <input
              type="text"
              name="city"
              [(ngModel)]="problem.city"
              required
              class="bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-300 rounded-lg py-3 px-4 block w-full transition">
          </div>

          <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">
              Pincode
            </label>
            <input
              type="text"
              name="pincode"
              [(ngModel)]="problem.pincode"
              required
              class="bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-300 rounded-lg py-3 px-4 block w-full transition">
          </div>

        </div>

        <!-- Image Upload -->
        <div class="mt-4">
          <label class="block text-gray-700 text-sm font-semibold mb-2">
            Upload Image
          </label>
          <input
            type="file"
            (change)="onFileSelected($event)"
            accept="image/*"
            class="block w-full text-sm text-gray-600
                   file:mr-4 file:py-2 file:px-4
                   file:rounded-lg file:border-0
                   file:text-sm file:font-semibold
                   file:bg-indigo-50 file:text-indigo-700
                   hover:file:bg-indigo-100">
        </div>

        <div class="mt-6">
  <div class="mt-4">
  <div class="mt-4">
  <button
    type="button"
    (click)="getLocation()"
    [disabled]="locationLoading"
    class="inline-flex items-center gap-2
           bg-gray-100 hover:bg-gray-200
           text-gray-700 text-sm font-medium
           py-2 px-4 rounded-lg
           transition duration-200
           shadow-sm hover:shadow
           disabled:opacity-60 disabled:cursor-not-allowed">

    <!-- Spinner -->
    <svg *ngIf="locationLoading"
         class="animate-spin h-4 w-4 text-indigo-600"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         viewBox="0 0 24 24">
      <circle class="opacity-25"
              cx="12" cy="12" r="10"
              stroke="currentColor"
              stroke-width="4">
      </circle>
      <path class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z">
      </path>
    </svg>

    <!-- Location Icon (Only when not loading) -->
    <svg *ngIf="!locationLoading"
         xmlns="http://www.w3.org/2000/svg"
         class="h-4 w-4 text-indigo-600"
         fill="none"
         viewBox="0 0 24 24"
         stroke="currentColor">
      <path stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5"
              stroke="currentColor"
              stroke-width="2"/>
    </svg>

    {{ locationLoading ? 'Detecting location...' : 'Use Current Location' }}
  </button>
</div>

</div>

</div>



        <!-- Submit Button -->
        <div class="mt-8">
          <button
            type="submit"
            [disabled]="loading"
            class="bg-indigo-600 text-white font-bold py-3 px-4 w-full rounded-lg hover:bg-indigo-700 transition duration-300 flex items-center justify-center disabled:bg-indigo-400">

            <!-- Spinner -->
            <svg *ngIf="loading"
              class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25"
                cx="12" cy="12" r="10"
                stroke="currentColor"
                stroke-width="4">
              </circle>
              <path class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>

            {{ loading ? 'Submitting...' : 'Submit Problem' }}
          </button>
        </div>

      </form>

    </div>

  </div>

</div>
