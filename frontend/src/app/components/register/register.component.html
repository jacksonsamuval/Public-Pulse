<div class="py-10">
    <div
        class="flex bg-white rounded-lg shadow-lg overflow-hidden mx-auto max-w-sm lg:max-w-4xl">
        <div class="hidden lg:block lg:w-1/2 bg-cover">
            <img src="/images/register.jpg" alt>
        </div>
        <div class="w-full p-8 lg:w-1/2">
            <h2 class="text-2xl font-semibold text-gray-700 text-center">Brand</h2>
            <p class="text-xl text-gray-600 text-center">Create your account!</p>

            <div *ngIf="isLoading" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <div class="flex items-center">
                        <svg class="animate-spin h-8 w-8 text-gray-700 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="text-gray-700 font-semibold">Registering...</span>
                    </div>
                </div>
            </div>

            <div class="mt-4 flex items-center justify-between">
                <span class="border-b w-1/5 lg:w-1/4"></span>
                <a href="#"
                    class="text-xs text-center text-gray-500 uppercase">signup
                    with email</a>
                <span class="border-b w-1/5 lg:w-1/4"></span>
            </div>

            <form (ngSubmit)="registerUser()">
                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Username</label>
                    <input [(ngModel)]="user.username" name="username"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Name</label>
                    <input [(ngModel)]="user.name" name="name"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Age</label>
                    <input [(ngModel)]="user.age" name="age"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Mobile Number</label>
                    <input [(ngModel)]="user.mobileNo" name="mobileNo"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="tel" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Email
                        Address</label>
                    <input [(ngModel)]="user.email" name="email"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="email" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Address</label>
                    <input [(ngModel)]="user.address" name="address"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Pincode</label>
                    <input [(ngModel)]="user.pinCode" name="pinCode"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter City</label>
                    <input [(ngModel)]="user.city" name="city"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Taluk</label>
                    <input [(ngModel)]="user.taluk" name="taluk"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter District</label>
                    <input [(ngModel)]="user.district" name="district"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter State</label>
                    <input [(ngModel)]="user.state" name="state"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>
                
                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Enter Country</label>
                    <input [(ngModel)]="user.country" name="country"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="text" />
                </div>

                <div class="mt-4">
                    <label
                        class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input [(ngModel)]="user.password" name="password"
                        class="bg-gray-200 text-gray-700 focus:outline-none focus:shadow-outline border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
                        type="password" />
                </div>

                <div class="mt-8">
                    <button 
                        [disabled]="isLoading"
                        class="bg-gray-700 text-white font-bold py-2 px-4 w-full rounded hover:bg-gray-600 disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center">
                        
                        <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        
                        {{ isLoading ? 'Registering...' : 'Sign Up' }}
                    </button>
                </div>

            </form>
            <div class="mt-4 flex items-center justify-between">
                    <span class="border-b w-1/5 md:w-1/4"></span>
                    <a href="#" class="text-xs text-gray-500 uppercase"
                        routerLink="/login">login</a>
                    <span class="border-b w-1/5 md:w-1/4"></span>
            </div>
        </div>
    </div>
</div>
